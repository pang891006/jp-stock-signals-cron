# Daily TOPIX scan trigger for 日株信号 (M5 T5.4).
# Fires repeatedly 12:00-15:50 JST (03:00-06:50 UTC) rather than once: one pass
# only covers ~360-720 of the 1633-stock pool inside the Function's 240s budget,
# and resume_cursor carries within a single JST day, so successive runs finish
# the day's coverage. Once a run reports status=done, later runs short-circuit
# (already_done_today) and cost one DB read. Push fires only on the complete run.
#
# Auth = Bearer SCAN_TOKEN. The token is generated by the server and stored in
# the app's private database; read it (while logged in) from 设置 → 自动扫描 →
# 「获取令牌」, then copy it into this repo's Secrets. The gateway additionally
# requires a same-origin `Origin` header on POST; it is derived from SCAN_URL
# below and is NOT a secret. The token — not the Origin — is the real gate:
# anonymous callers without it get 401.
#
# Repo Secrets required:
#   SCAN_URL   = https://<site>/functions/v1/app?action=scan  (copy from settings page)
#   SCAN_TOKEN = the token shown on the settings page (copy button)
name: daily-scan

on:
  schedule:
    - cron: "*/10 3-6 * * *"
  workflow_dispatch:

# Never overlap: a queued run waits instead of cancelling one mid-scan.
concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger scan
        env:
          SCAN_URL: ${{ secrets.SCAN_URL }}
          SCAN_TOKEN: ${{ secrets.SCAN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SCAN_URL:-}" ] || [ -z "${SCAN_TOKEN:-}" ]; then
            echo "SCAN_URL / SCAN_TOKEN repo secrets are not set" >&2
            exit 1
          fi
          origin="${SCAN_URL%%/functions*}"
          code=$(curl -s -o resp.json -w '%{http_code}' \
            -X POST "$SCAN_URL" \
            -H "Origin: $origin" \
            -H "Authorization: Bearer $SCAN_TOKEN" \
            -H "accept: application/json")
          echo "HTTP $code"
          cat resp.json; echo
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "scan failed with HTTP $code" >&2
            exit 1
          fi
